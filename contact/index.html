    :root {

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
    a { color: var(--accent); text-decoration: none; }
    header, .footer, main { max-width: 960px; margin: auto; width: 100%; padding: 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 1.25rem; letter-spacing: 0.2px; }
    nav { display: flex; gap: 1rem; align-items: center; }
    nav a { position: relative; display:inline-block; padding-bottom: 2px; }
    nav a::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: currentColor; transition: width .2s ease; }
    nav a:hover::after, nav a:focus-visible::after, nav a[aria-current="page"]::after { width: 100%; }

    main { flex: 1; }
    .hero { text-align: center; padding: 3rem 1rem 1rem; }
    .hero h1 { font-family: 'Playfair Display', serif; font-weight: 800; letter-spacing: 0.2px; font-size: clamp(2rem, 5.5vw, 3.2rem); margin: 0 0 .5rem; }
    .hero p { color: var(--muted); max-width: 720px; margin: .25rem auto 0; }

    .wrap { display: grid; grid-template-columns: 1fr; gap: 1rem; padding: 1rem; }
    @media (min-width: 860px) { .wrap { grid-template-columns: 2fr 1fr; } }

    .card { background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01)); border: 1px solid rgba(226,232,240,.08); border-radius: 14px; padding: 1rem; }

    .field { margin-bottom: .9rem; }
    .label { display:block; margin-bottom:.35rem; font-weight:600; }
    .input, .textarea { width:100%; background: #0b1220; color: var(--fg); border:1px solid rgba(226,232,240,.12); border-radius: 10px; padding: .7rem .8rem; font-size: 1rem; outline: none; }
    .input:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 6px var(--ring); }
    .textarea { min-height: 140px; resize: vertical; }

    .row { display:grid; gap:.8rem; grid-template-columns: 1fr; }
    @media (min-width: 580px) { .row { grid-template-columns: 1fr 1fr; } }

    .hint { color: var(--muted); font-size:.9rem; margin-top:.25rem; }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border:1px solid var(--accent); border-radius: 10px; padding:.6rem .9rem; font-weight:600; cursor:pointer; background: transparent; color: var(--fg); }
    .btn:hover { transform: translateY(-1px); }

    .status { margin-top:.75rem; font-size:.95rem; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }

    .list { list-style:none; padding:0; margin:.2rem 0 0; }
    .list li { display:flex; align-items:center; gap:.6rem; padding:.5rem 0; border-bottom:1px dashed rgba(226,232,240,.08); }

    .footer { display:flex; justify-content:space-between; align-items:center; gap:1rem; color: var(--muted); font-size:.95rem; }
    .social { display:flex; gap:10px; }
    .icon { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid rgba(226,232,240,0.18); color: #aeb7c4; transition: transform .15s ease, color .15s ease, border-color .15s ease; }
    .icon:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
