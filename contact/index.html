  <style>
    :root{--bg:#0b1120;--fg:#e2e8f0;--muted:#64748b;--accent:#6366f1;--accent-glow:rgba(99,102,241,0.12);--accent-border:rgba(99,102,241,0.2);--card:#1a2332;--border:rgba(148,163,184,0.07);--radius:14px;--radius-sm:8px;--green:#22c55e;--green-glow:rgba(34,197,94,0.1);--green-border:rgba(34,197,94,0.2);--red:#ef4444;--red-glow:rgba(239,68,68,0.1);--red-border:rgba(239,68,68,0.2)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    a{color:var(--accent);text-decoration:none;transition:opacity .2s}a:hover{opacity:.85}
    ::selection{background:var(--accent);color:#fff}
    .container{max-width:640px;margin:0 auto;padding:0 1.5rem}
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease}
    .reveal.visible{opacity:1;transform:translateY(0)}

    /* ===== Header ===== */
    header{display:flex;justify-content:space-between;align-items:center;padding:1.75rem 0 1.25rem;border-bottom:1px solid var(--border)}
    .brand{font-family:'Playfair Display',serif;font-weight:700;font-size:1.25rem;color:var(--fg)}.brand span{color:var(--accent)}
    nav{display:flex;gap:1.5rem;align-items:center}
    nav a{position:relative;color:var(--muted);font-size:.9rem;font-weight:500;padding-bottom:2px;transition:color .2s}
    nav a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--accent);transition:width .25s ease}
    nav a:hover{color:var(--fg)}nav a:hover::after,nav a.active::after,nav a[aria-current="page"]::after{width:100%}

    /* ===== Profile ===== */
    .profile{padding:3rem 0 1.5rem;text-align:center}
    .profile-avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--accent-border);box-shadow:0 0 30px var(--accent-glow);margin-bottom:1rem}
    .profile h1{font-family:'Playfair Display',serif;font-weight:700;font-size:1.6rem}

    /* ===== Contact Cards ===== */
    .contact-cards{display:flex;flex-direction:column;gap:.75rem;padding-bottom:2rem}
    .contact-card{display:flex;align-items:center;gap:.85rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;transition:border-color .2s,transform .2s;color:var(--fg)}
    .contact-card:hover{border-color:var(--accent-border);transform:translateY(-2px)}
    .contact-card .icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:var(--accent-glow);color:var(--accent);flex-shrink:0}
    .contact-card .icon svg{width:20px;height:20px}
    .contact-card .info{flex:1}
    .contact-card .label{font-weight:600;font-size:.85rem;color:var(--muted)}
    .contact-card .value{font-size:.95rem;color:var(--fg)}
    .contact-card .action{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--accent);white-space:nowrap}

    /* ===== Section ===== */
    .section{padding-bottom:2rem}
    .section-head{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
    .section-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
    .section-head h2{font-size:1rem;font-weight:600}

    /* ===== Verify ===== */
    .verify-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem}
    .verify-box .desc{color:var(--muted);font-size:.85rem;margin-bottom:1.1rem;line-height:1.6}

    /* Dropdown search row */
    .verify-search-row{display:flex;align-items:stretch;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:visible;transition:border-color .2s;position:relative}
    .verify-search-row:focus-within{border-color:var(--accent-border)}

    /* Platform dropdown trigger */
    .verify-dropdown-btn{display:flex;align-items:center;gap:4px;padding:0 10px 0 12px;cursor:pointer;border:none;background:transparent;color:var(--muted);transition:color .2s;flex-shrink:0;font-family:'Inter',system-ui,sans-serif;font-size:.78rem;position:relative}
    .verify-dropdown-btn:hover,.verify-dropdown-btn.open{color:var(--accent)}
    .verify-dropdown-btn .dd-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
    .verify-dropdown-btn .dd-icon svg{width:16px;height:16px;fill:currentColor}
    .verify-dropdown-btn .dd-arrow{margin-left:2px;font-size:.6rem;transition:transform .2s}
    .verify-dropdown-btn.open .dd-arrow{transform:rotate(180deg)}

    /* Dropdown menu */
    .verify-dropdown{display:none;position:absolute;left:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--accent-border);border-radius:var(--radius-sm);padding:.35rem;min-width:auto;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.4)}
    .verify-dropdown.show{display:block}
    .verify-dropdown-item{display:flex;align-items:center;justify-content:center;padding:.5rem .65rem;cursor:pointer;border-radius:6px;color:var(--muted);transition:all .15s;border:none;background:transparent;width:100%}
    .verify-dropdown-item:hover{background:var(--accent-glow);color:var(--fg)}
    .verify-dropdown-item.active{color:var(--accent);background:var(--accent-glow)}
    .verify-dropdown-item svg{width:20px;height:20px;fill:currentColor}

    /* Input */
    .verify-input{flex:1;background:transparent;border:none;padding:.7rem .25rem .7rem 0;color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:.85rem;outline:none;min-width:0}
    .verify-input::placeholder{color:var(--muted);font-weight:400;font-family:'Inter',system-ui,sans-serif}
    .verify-input:disabled{opacity:.5;cursor:not-allowed}

    /* Search button */
    .verify-search-btn{width:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--muted);transition:color .2s,background .2s;flex-shrink:0;border-radius:0}
    .verify-search-btn:hover{color:var(--accent);background:var(--accent-glow)}
    .verify-search-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .verify-search-btn:disabled{opacity:.4;cursor:not-allowed}
    .verify-search-btn:disabled:hover{color:var(--muted);background:transparent}

    /* Result */
    .verify-result{display:none;border-radius:var(--radius-sm);padding:.85rem 1.1rem;font-size:.88rem;line-height:1.6;animation:fadeSlide .3s ease;margin-top:.85rem}
    .verify-result.show{display:block}
    .verify-result.verified{background:var(--green-glow);border:1px solid var(--green-border);color:var(--green)}
    .verify-result.fake{background:var(--red-glow);border:1px solid var(--red-border);color:var(--red)}
    .verify-result .result-icon{font-size:1.1rem;margin-right:.3rem}
    .verify-result .result-detail{color:var(--muted);font-size:.8rem;margin-top:.3rem}

    @keyframes fadeSlide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

    /* ===== Footer ===== */
    footer{text-align:center;padding:2.5rem 0;border-top:1px solid var(--border);color:var(--muted);font-size:.82rem}
    footer a{color:var(--muted)}footer a:hover{color:var(--accent)}

    /* ===== Responsive ===== */
    @media(max-width:640px){
      header{flex-direction:column;gap:.75rem;text-align:center;padding:1.25rem 0 1rem}
      nav{gap:1.1rem}nav a{font-size:.85rem}
      .profile-avatar{width:100px;height:100px}
    }
    .skip-link{position:absolute;top:-100%;left:0;z-index:9999;padding:.5rem 1rem;background:var(--accent);color:#fff;font-size:.85rem;font-weight:600;transition:top .2s}
    .skip-link:focus{top:0}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

    @view-transition{navigation:auto}

    /* Theme toggle button */
    .theme-toggle{display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;transition:color .2s,background .2s;flex-shrink:0}
    .theme-toggle:hover{color:var(--fg);background:var(--accent-glow)}
    .theme-toggle svg{width:18px;height:18px}
    .theme-toggle .sun{display:block}
    .theme-toggle .moon{display:none}
    [data-theme="light"] .theme-toggle .sun{display:none}
    [data-theme="light"] .theme-toggle .moon{display:block}

    /* Light mode variables */
    [data-theme="light"]{--bg:#f8fafc;--fg:#1e293b;--muted:#64748b;--accent:#6366f1;--accent-glow:rgba(99,102,241,0.08);--accent-border:rgba(99,102,241,0.15);--card:#ffffff;--border:rgba(0,0,0,0.06)}

    .lang-btn{display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:.75rem;font-weight:600;font-family:'JetBrains Mono',monospace;transition:color .2s,background .2s;letter-spacing:.5px;flex-shrink:0}
    .lang-btn:hover{color:var(--fg);background:var(--accent-glow)}
    .lang-btn.active{color:var(--accent)}
  </style>

            <button class="verify-dropdown-item" role="option" aria-selected="false" data-platform="bluesky" onclick="selectPlatform('bluesky')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.202 2.857C7.954 4.922 10.913 9.11 12 11.358c1.087-2.247 4.046-6.436 6.798-8.501C20.783 1.366 24 .213 24 3.883c0 .732-.42 6.156-.667 7.037-.856 3.061-3.978 3.842-6.755 3.37 4.854.826 6.089 3.562 3.422 6.299-5.065 5.196-7.28-1.304-7.847-2.97-.104-.305-.152-.448-.153-.327 0-.121-.05.022-.153.327-.568 1.666-2.782 8.166-7.847 2.97-2.667-2.737-1.432-5.473 3.422-6.3-2.777.473-5.899-.308-6.755-3.369C.42 10.04 0 4.615 0 3.883c0-3.67 3.217-2.517 5.202-1.026"/></svg></button>
            <button class="verify-dropdown-item" role="option" aria-selected="false" data-platform="threads" onclick="selectPlatform('threads')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.186 24h-.007c-3.581-.024-6.334-1.205-8.184-3.509C2.35 18.44 1.5 15.586 1.472 12.01v-.017c.03-3.579.879-6.43 2.525-8.482C5.845 1.205 8.6.024 12.18 0h.014c2.746.02 5.043.725 6.826 2.098 1.677 1.29 2.858 3.13 3.509 5.467l-2.04.569c-1.104-3.96-3.898-5.984-8.304-6.015-2.91.022-5.11.936-6.54 2.717C4.307 6.504 3.616 8.914 3.589 12c.027 3.086.718 5.496 2.057 7.164 1.43 1.783 3.631 2.698 6.54 2.717 2.623-.02 4.358-.631 5.8-2.045 1.647-1.613 1.618-3.593 1.09-4.798-.31-.71-.873-1.3-1.634-1.75-.192 1.352-.622 2.446-1.284 3.272-.886 1.102-2.14 1.704-3.73 1.79-1.202.065-2.361-.218-3.259-.801-1.063-.689-1.685-1.74-1.752-2.964-.065-1.19.408-2.285 1.33-3.082.88-.76 2.119-1.207 3.583-1.291a13.853 13.853 0 0 1 3.02.142c-.126-.742-.375-1.332-.75-1.757-.513-.586-1.308-.883-2.359-.89h-.029c-.844 0-1.992.232-2.721 1.32L7.734 7.847c.98-1.454 2.568-2.256 4.478-2.256h.044c3.194.02 5.097 1.975 5.287 5.388.108.046.216.094.321.142 1.49.7 2.58 1.761 3.154 3.07.797 1.82.871 4.79-1.548 7.158-1.85 1.81-4.094 2.628-7.277 2.65Zm1.003-11.69c-.242 0-.487.007-.739.021-1.836.103-2.98.946-2.916 2.143.067 1.256 1.452 1.839 2.784 1.767 1.224-.065 2.818-.543 3.086-3.71a10.5 10.5 0 0 0-2.215-.221z"/></svg></button>
            <button class="verify-dropdown-item" role="option" aria-selected="false" data-platform="tiktok" onclick="selectPlatform('tiktok')"><svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15.2a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.99a8.21 8.21 0 0 0 4.8 1.54V7.08a4.84 4.84 0 0 1-1.04-.39z"/></svg></button>
          </div>

          <input type="text" class="verify-input" id="verifyInput" placeholder="Pilih platform dulu..." autocomplete="off" spellcheck="false" disabled>
          <button class="verify-search-btn" id="verifySearchBtn" onclick="verifyAccount()" aria-label="Cari" disabled>
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
        <div class="verify-result" id="verifyResult"></div>
      </div>
    </div>

    <footer>
      <p>© <span id="year"></span> yujiwh</p>
    </footer>
    </main>
  </div>

  <script>
    (function(){
      const translations = {
        'nav-home': { id: 'Home', en: 'Home' },
        'nav-projects': { id: 'Projects', en: 'Projects' },
        'nav-blog': { id: 'Blog', en: 'Blog' },
        'nav-contact': { id: 'Contact', en: 'Contact' },
        'section-contact': { id: 'Contact', en: 'Contact' },
        'section-verification': { id: 'Verification', en: 'Verification' },
        'label-email': { id: 'Email', en: 'Email' },
        'label-telegram': { id: 'Telegram', en: 'Telegram' },
        'label-signal': { id: 'Signal', en: 'Signal' },
        'verify-desc': { id: 'Verifikasi keaslian username atau link media sosial saya.', en: 'Verify the authenticity of my social media username or link.' },
      };
      function applyLang(lang){
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.dataset.i18n;
          if(translations[key] && translations[key][lang]){
            if(el.dataset.i18nHtml) el.innerHTML = translations[key][lang];
            else el.textContent = translations[key][lang];
          }
        });
        document.getElementById('langBtn').textContent = lang === 'id' ? 'ID' : 'EN';
      }
      const stored = localStorage.getItem('lang') || 'id';
      window.toggleLang = function(){
        const cur = localStorage.getItem('lang') || 'id';
        const next = cur === 'id' ? 'en' : 'id';
        localStorage.setItem('lang', next);
        applyLang(next);
      };
      window.__applyLang = applyLang;
      applyLang(stored);
    })();

    (function(){
      const pref = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', pref);
      window.toggleTheme = function(){
        const cur = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      };
    })();

    // === Verified accounts database ===
    const platformData = {
      'twitter':   { label: 'X (Twitter)', placeholder: '@username / link', accounts: ['@yujiwh','yujiwh','x.com/yujiwh','twitter.com/yujiwh'] },
      'instagram': { label: 'Instagram',  placeholder: '@username / link', accounts: ['@yujiwh','yujiwh','instagram.com/yujiwh'] },
      'facebook':  { label: 'Facebook',   placeholder: '@username / link', accounts: ['yujiwh','facebook.com/yujiwh','www.facebook.com/yujiwh'] },
      'bluesky':   { label: 'Bluesky',    placeholder: '@username / link', accounts: ['@yujiwh.xyz','yujiwh.xyz','bsky.app/profile/yujiwh.xyz'] },
      'threads':   { label: 'Threads',    placeholder: '@username / link', accounts: ['@yujiwh','yujiwh','threads.net/@yujiwh'] },
      'tiktok':    { label: 'TikTok',     placeholder: '@username / link', accounts: ['@realyujiwh','realyujiwh','tiktok.com/@realyujiwh'] }
    };

    let selectedPlatform = null;

    // === Dropdown toggle ===
    function toggleDropdown() {
      const menu = document.getElementById('ddMenu');
      const btn = document.getElementById('ddBtn');
      const isOpen = menu.classList.toggle('show');
      btn.classList.toggle('open', isOpen);
      btn.setAttribute('aria-expanded', isOpen);
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      const row = document.querySelector('.verify-search-row');
      const menu = document.getElementById('ddMenu');
      const btn = document.getElementById('ddBtn');
      if (row && !row.contains(e.target) && menu.classList.contains('show')) {
        setTimeout(() => {
           menu.classList.remove('show');
           btn.classList.remove('open');
           btn.setAttribute('aria-expanded', 'false');
        }, 150);
      }
    });

    // === Select platform ===
    function selectPlatform(key) {
      selectedPlatform = key;

      // Update dropdown icon from the active item's SVG
      const activeItem = document.querySelector(`.verify-dropdown-item[data-platform="${key}"]`);
      if (activeItem) {
        document.getElementById('ddIcon').innerHTML = activeItem.innerHTML;
      }

      // Mark active item in dropdown
      document.querySelectorAll('.verify-dropdown-item').forEach(el => {
        el.classList.toggle('active', el.dataset.platform === key);
        el.setAttribute('aria-selected', el.dataset.platform === key ? 'true' : 'false');
      });

      // Close dropdown
      document.getElementById('ddMenu').classList.remove('show');
      document.getElementById('ddBtn').classList.remove('open');
      document.getElementById('ddBtn').setAttribute('aria-expanded', 'false');

      // Enable input + search button
      const inputEl = document.getElementById('verifyInput');
      inputEl.placeholder = platformData[key].placeholder;
      inputEl.disabled = false;
      inputEl.focus();

      document.getElementById('verifySearchBtn').disabled = false;

      // Clear previous result
      document.getElementById('verifyResult').className = 'verify-result';
      document.getElementById('verifyResult').innerHTML = '';
    }

    // === Normalize input ===
    function normalize(s) {
      return s.trim().toLowerCase()
        .replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/^mailto:/, '').replace(/\/+$/, '');
    }

    // === Verify ===
    function verifyAccount() {
      const raw = document.getElementById('verifyInput').value.trim();
      const resultEl = document.getElementById('verifyResult');

      if (!selectedPlatform) {
        resultEl.className = 'verify-result fake show';
        resultEl.innerHTML = '<span class="result-icon">👆</span> <strong>Pilih platform dulu</strong><div class="result-detail">Klik ikon di kiri search bar, lalu pilih sosial media yang mau dicek.</div>';
        return;
      }

      if (!raw) {
        resultEl.className = 'verify-result fake show';
        resultEl.innerHTML = '<span class="result-icon">✏️</span> <strong>Masukkan username atau link</strong><div class="result-detail">Ketik username atau URL yang ingin dicek.</div>';
        return;
      }

      const normalized = normalize(raw);
      const data = platformData[selectedPlatform];
      let found = false;

      for (const acc of data.accounts) {
        if (normalized === normalize(acc) || normalized.endsWith(normalize(acc))) {
          found = true;
          break;
        }
      }

      if (found) {
        resultEl.className = 'verify-result verified show';
        resultEl.innerHTML = '<span class="result-icon">✅</span> <strong>Verified — Akun Resmi</strong><div class="result-detail">' + data.label + ' ini benar milik <strong>yujiwh</strong></div>';
      } else {
        resultEl.className = 'verify-result fake show';
        resultEl.innerHTML = '<span class="result-icon">⚠️</span> <strong>Fake — Bukan Akun Resmi</strong><div class="result-detail">' + data.label + ' ini <strong>bukan</strong> milik yujiwh. Berhati-hatilah!</div>';
      }
    }

    // Enter key
    document.getElementById('verifyInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') verifyAccount();
    });

    // === Scroll reveal ===
    const observer = new IntersectionObserver(e => {
      e.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: .08, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
