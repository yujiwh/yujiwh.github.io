<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog — yujiwh</title>
  <meta name="description" content="Catatan tentang privasi, teknologi, dan desentralisasi oleh yujiwh.">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Cpath d='M20 18l12 14 12-14' stroke='%23e2e8f0' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M32 32v14' stroke='%23e2e8f0' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{--bg:#0b1120;--fg:#e2e8f0;--muted:#64748b;--accent:#6366f1;--accent-glow:rgba(99,102,241,0.12);--accent-border:rgba(99,102,241,0.2);--card:#1a2332;--border:rgba(148,163,184,0.07);--radius:14px;--radius-sm:8px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none;transition:opacity .2s}a:hover{opacity:.85}
    ::selection{background:var(--accent);color:#fff}
    .container{max-width:780px;margin:0 auto;padding:0 1.5rem}
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease}
    .reveal.visible{opacity:1;transform:translateY(0)}

    header{display:flex;justify-content:space-between;align-items:center;padding:1.75rem 0 1.25rem;border-bottom:1px solid var(--border)}
    .brand{font-family:'Playfair Display',serif;font-weight:700;font-size:1.25rem;color:var(--fg)}.brand span{color:var(--accent)}
    nav{display:flex;gap:1.5rem;align-items:center}
    nav a{position:relative;color:var(--muted);font-size:.9rem;font-weight:500;padding-bottom:2px;transition:color .2s}
    nav a::after{content:'';position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--accent);transition:width .25s ease}
    nav a:hover{color:var(--fg)}nav a:hover::after,nav a.active::after,nav a[aria-current="page"]::after{width:100%}

    .page-head{padding:3.5rem 0 1.5rem;text-align:center}
    .page-head h1{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(1.8rem,4vw,2.5rem)}
    .page-head p{color:var(--muted);margin-top:.4rem;font-size:.95rem}

    .empty{padding:3.5rem 1rem;text-align:center}
    .empty .glyph{font-size:2.5rem;margin-bottom:1rem;opacity:.3;font-family:'Playfair Display',serif}
    .empty h2{font-size:1.15rem;font-weight:600;margin-bottom:.4rem}
    .empty p{color:var(--muted);font-size:.88rem;max-width:380px;margin:0 auto;line-height:1.6}

    .post{border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem 1.5rem;margin-bottom:.85rem;transition:border-color .2s,transform .2s;background:var(--card)}
    .post:hover{border-color:var(--accent-border);transform:translateY(-2px)}
    .post .date{font-size:.78rem;color:var(--muted);margin-bottom:.35rem}
    .post h2{font-size:1.05rem;font-weight:600;margin-bottom:.3rem}
    .post .excerpt{color:var(--muted);font-size:.85rem;line-height:1.6}
    .post .read{display:inline-flex;align-items:center;gap:4px;margin-top:.6rem;font-size:.82rem;font-weight:500}

    footer{text-align:center;padding:2.5rem 0;border-top:1px solid var(--border);color:var(--muted);font-size:.82rem;margin-top:1rem}
    footer a{color:var(--muted)}footer a:hover{color:var(--accent)}

    @media(max-width:640px){
      header{flex-direction:column;gap:.75rem;text-align:center;padding:1.25rem 0 1rem}
      nav{gap:1.1rem}nav a{font-size:.85rem}
    }
    .skip-link{position:absolute;top:-100%;left:0;z-index:9999;padding:.5rem 1rem;background:var(--accent);color:#fff;font-size:.85rem;font-weight:600;transition:top .2s}
    .skip-link:focus{top:0}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

    @view-transition{navigation:auto}

    /* Theme toggle button */
    .theme-toggle{display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;transition:color .2s,background .2s;flex-shrink:0}
    .theme-toggle:hover{color:var(--fg);background:var(--accent-glow)}
    .theme-toggle svg{width:18px;height:18px}
    .theme-toggle .sun{display:block}
    .theme-toggle .moon{display:none}
    [data-theme="light"] .theme-toggle .sun{display:none}
    [data-theme="light"] .theme-toggle .moon{display:block}

    /* Light mode variables */
    [data-theme="light"]{--bg:#f8fafc;--fg:#1e293b;--muted:#64748b;--accent:#6366f1;--accent-glow:rgba(99,102,241,0.08);--accent-border:rgba(99,102,241,0.15);--card:#ffffff;--border:rgba(0,0,0,0.06)}

    .lang-btn{display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:.75rem;font-weight:600;font-family:'JetBrains Mono',monospace;transition:color .2s,background .2s;letter-spacing:.5px;flex-shrink:0}
    .lang-btn:hover{color:var(--fg);background:var(--accent-glow)}
    .lang-btn.active{color:var(--accent)}
  </style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "yujiwh",
  "url": "https://yujiwh.xyz",
  "sameAs": [
    "https://x.com/yujiwh",
    "https://instagram.com/yujiwh",
    "https://facebook.com/yujiwh",
    "https://bsky.app/profile/yujiwh.xyz"
  ]
}
</script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="container">
    <main id="main">
    <header>
      <a href="/" class="brand">yuji<span>wh</span></a>
      <nav>
        <a href="/" data-i18n="nav-home">Home</a>
        <a href="/projects/" data-i18n="nav-projects">Projects</a>
        <a href="/blog/" aria-current="page" data-i18n="nav-blog">Blog</a>
        <a href="/contact/" data-i18n="nav-contact">Contact</a>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
        <button class="lang-btn" id="langBtn" onclick="toggleLang()" aria-label="Ganti bahasa">ID</button>
      </nav>
    </header>

    <div class="page-head reveal">
      <h1 data-i18n="page-title">Blog</h1>
      <p data-i18n="page-desc">Catatan tentang privasi, teknologi, dan desentralisasi.</p>
    </div>

    <!-- Template post — uncomment to publish -->
    <!--
    <div class="post reveal">
      <div class="date">13 Juni 2026</div>
      <h2>Judul Tulisan</h2>
      <p class="excerpt">Ringkasan singkat dari tulisan ini...</p>
      <a class="read" href="#">Baca selengkapnya →</a>
    </div>
    -->

    <div class="empty reveal">
      <div class="glyph">✦</div>
      <h2 data-i18n="empty-title">Belum ada tulisan</h2>
      <p data-i18n="empty-desc">Tulisan baru akan ditambahkan di sini. Pantau terus untuk catatan seputar privasi, enkripsi, dan teknologi desentralisasi.</p>
    </div>

    <footer>
      <p>© <span id="year"></span> yujiwh</p>
    </footer>
    </main>
  </div>

  <script>
    (function(){
      const translations = {
        'nav-home': { id: 'Home', en: 'Home' },
        'nav-projects': { id: 'Projects', en: 'Projects' },
        'nav-blog': { id: 'Blog', en: 'Blog' },
        'nav-contact': { id: 'Contact', en: 'Contact' },
        'page-title': { id: 'Blog', en: 'Blog' },
        'page-desc': { id: 'Catatan tentang privasi, teknologi, dan desentralisasi.', en: 'Notes on privacy, technology, and decentralization.' },
        'empty-title': { id: 'Belum ada tulisan', en: 'No posts yet' },
        'empty-desc': { id: 'Tulisan baru akan ditambahkan di sini. Pantau terus untuk catatan seputar privasi, enkripsi, dan teknologi desentralisasi.', en: 'New posts will appear here. Stay tuned for notes on privacy, encryption, and decentralized technology.' }
      };
      function applyLang(lang){
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.dataset.i18n;
          if(translations[key] && translations[key][lang]){
            if(el.dataset.i18nHtml) el.innerHTML = translations[key][lang];
            else el.textContent = translations[key][lang];
          }
        });
        document.getElementById('langBtn').textContent = lang === 'id' ? 'ID' : 'EN';
      }
      const stored = localStorage.getItem('lang') || 'id';
      window.toggleLang = function(){
        const cur = localStorage.getItem('lang') || 'id';
        const next = cur === 'id' ? 'en' : 'id';
        localStorage.setItem('lang', next);
        applyLang(next);
      };
      window.__applyLang = applyLang;
      applyLang(stored);
    })();

    (function(){
      const pref = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', pref);
      window.toggleTheme = function(){
        const cur = document.documentElement.getAttribute('data-theme') || 'dark';
        const next = cur === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      };
    })();

    const observer = new IntersectionObserver(e => {
      e.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: .08, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
