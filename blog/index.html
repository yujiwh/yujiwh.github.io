<!DOCTYPE html>
<html lang="id"><head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maintenance</title>
  <meta name="description" content="Blog sedang dalam perbaikan." />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- Minimal monogram favicon (Y) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f172a'/%3E%3Cpath d='M20 18l12 14 12-14' stroke='%23e2e8f0' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M32 32v14' stroke='%23e2e8f0' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --accent:#4f46e5; --card:#1e293b; --ring:rgba(79,70,229,.3); }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
    a{color:var(--accent);text-decoration:none}
    header,.footer,main{max-width:960px;margin:auto;width:100%;padding:1rem}
    header{display:flex;justify-content:space-between;align-items:center}
    .brand{font-family:'Playfair Display',serif;font-weight:800;font-size:1.25rem;letter-spacing:.2px}
    nav{display:flex;gap:1rem;align-items:center}
    nav a{position:relative;display:inline-block;padding-bottom:2px}
    nav a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:currentColor;transition:width .2s ease}
    nav a:hover::after,nav a[aria-current="page"]::after{width:100%}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.hero h1{font-family:'Playfair Display',serif;font-weight:800;letter-spacing:.2px;font-size:clamp(2.2rem,6vw,3.8rem);margin:.5rem 0}
.hero p{color:var(--muted);max-width:720px;margin:.25rem auto}
.badge{display:inline-flex;align-items:center;gap:.5rem;border:1px solid rgba(226,232,240,.16);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));padding:.35rem .6rem;border-radius:999px;font-size:.95rem}
.row{display:grid;gap:1rem;grid-template-columns:1fr}
@media(min-width:760px){.row{grid-template-columns:2fr 1fr}}
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid rgba(226,232,240,.08);border-radius:14px;padding:1rem;text-align:left}
.meta{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:.75rem;color:#cbd5e1}
.cta{display:flex;gap:.6rem;justify-content:center;margin-top:1rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--accent);border-radius:10px;padding:.6rem .9rem;font-weight:600;cursor:pointer;background:transparent;color:var(--fg)}
.btn:hover{transform:translateY(-1px)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}

.footer{display:flex;justify-content:space-between;align-items:center;gap:1rem;color:var(--muted);font-size:.95rem}
.social{display:flex;gap:10px}
.icon{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid rgba(226,232,240,.18);color:#aeb7c4;transition:transform .15s ease,color .15s ease,border-color .15s ease}
.icon:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  </style>
</head>
<body>
  <header>
    <div class="brand">yujiwh</div>
    <nav>
      <a href="/">Home</a>
      <a href="/maintenance" aria-current="page">Blog</a>
      <a href="/contact">Contact</a>
    </nav>
  </header>  <main>
    <div class="hero" aria-labelledby="maintenance-title">
      <div class="badge" aria-live="polite">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12l-4 8H6l-4-8 4-8h12l4 8zM12 8v4"/><circle cx="12" cy="16" r="1.2"/></svg>
        Scheduled Maintenance
      </div>
      <h1 id="maintenance-title">Blog sedang dalam perbaikan</h1>
      <p>Sedang dilakukan upgrade dan migrasi data.</p>
</div>

  </main>  <div class="footer">
    <div>© <span id="year"></span> yujiwh</div>
    <div class="social" aria-label="Sosial">
      <a class="icon" href="https://x.com/yujiwh" target="_blank" rel="noopener" aria-label="X.com">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2H21.756L14.35 10.56L23 22H16.385L10.924 14.772L4.637 22H1.122L9.06 12.84L1 2H7.802L12.685 8.59L18.244 2ZM17.09 19.984H18.91L7.044 3.888H5.078L17.09 19.984Z"/></svg>
        <span class="sr-only">Twitter</span>
      </a>
      <a class="icon" href="https://instagram.com/yujiwh" target="_blank" rel="noopener" aria-label="Instagram">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/></svg>
        <span class="sr-only">Instagram</span>
      </a>
      <a class="icon" href="https://zora.co/@yujiwh" target="_blank" rel="noopener" aria-label="Zora">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="sr-only">Zora</span>
      </a>
    </div>
  </div>
  <script>  
    // Tahun dinamis  
    document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
